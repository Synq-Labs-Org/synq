name: synq-foundation
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synq_local
      POSTGRES_DB: synq_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d synq_test']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7
    ports:
      - '127.0.0.1:56379:6379'
