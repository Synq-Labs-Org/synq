# Synq on one EC2 host (infra/aws/synq.cfn.yaml): Caddy terminates TLS for
# synqlabs.world, the web app serves pages and proxies /api/v1, and the
# Telegram service runs the live group bot on Monad testnet.
#
# CI builds the bot and web images for each green commit of main and pushes them
# to GHCR; the host pulls the ones for the commit it deploys and builds nothing
# (scripts/deploy/host-deploy.sh sets SYNQ_IMAGE_TAG). Values come from
# /opt/synq/.env, written from SSM Parameter Store on every deploy.
name: synq

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  caddy:
    <<: *hardening
    image: caddy:2.10.2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SYNQ_DOMAIN: ${SYNQ_DOMAIN:?set SYNQ_DOMAIN}
      SYNQ_ACME_EMAIL: ${SYNQ_ACME_EMAIL:?set SYNQ_ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    mem_limit: 96m

  postgres:
    <<: *hardening
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=60
      - -c
      - work_mem=4MB
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 320m

  bot:
    <<: *hardening
    image: ghcr.io/synq-labs-org/synq-bot:${SYNQ_IMAGE_TAG:?set SYNQ_IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNQ_TELEGRAM_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/synq_telegram_e2e
      SYNQ_WEB_BASE_URL: https://${SYNQ_DOMAIN}
      # Real passkeys enroll on the site's own domain.
      SYNQ_RP_ID: ${SYNQ_DOMAIN}
      SYNQ_ORIGIN: https://${SYNQ_DOMAIN}
      SYNQ_ALLOW_MAINNET_BROADCAST: 'false'
      SYNQ_WORKSPACES_ENABLED: ${SYNQ_WORKSPACES_ENABLED:-0}
      SYNQ_SCREENING_PROVIDER: ${SYNQ_SCREENING_PROVIDER:-}
      SYNQ_WORKSPACE_OPERATOR_KEY_FILE: /run/secrets/synq/workspace-operator.key
      SYNQ_WORKSPACE_GRANT_KEY_FILE: /run/secrets/synq/workspace-grant.key
      SYNQ_WORKSPACE_DAILY_GAS_WEI: ${SYNQ_WORKSPACE_DAILY_GAS_WEI:-1000000000000000000}
      SYNQ_WORKSPACE_CREATION_GAS_WEI: ${SYNQ_WORKSPACE_CREATION_GAS_WEI:-200000000000000000}
      SYNQ_MAINNET_CANARY_MAX_USD: '0'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SYNQ_MONAD_TESTNET_RPC_URL: ${SYNQ_MONAD_TESTNET_RPC_URL:-}
      SYNQ_CARD_LINK_KEY: ${SYNQ_CARD_LINK_KEY:-}
      # Arc testnet business features for the Messages app: Deal Room and
      # invoice checkout turn on with their link keys; the rest only reads Arc.
      SYNQ_DEALROOM_LINK_KEY: ${SYNQ_DEALROOM_LINK_KEY:-}
      SYNQ_PAY_LINK_KEY: ${SYNQ_PAY_LINK_KEY:-}
      SYNQ_ARC_RPC_URL: ${SYNQ_ARC_RPC_URL:-}
      SYNQ_ARC_VENDORS: ${SYNQ_ARC_VENDORS:-}
      SYNQ_ARC_OWNER: ${SYNQ_ARC_OWNER:-}
      SYNQ_ARC_BUSINESS_NAME: ${SYNQ_ARC_BUSINESS_NAME:-}
      SYNQ_ARC_FLOOR_USDC: ${SYNQ_ARC_FLOOR_USDC:-}
      # Duffel test-mode token (duffel_test_…); hotels are off without it.
      DUFFEL_TEST_TOKEN: ${DUFFEL_TEST_TOKEN:-}
      # Gifts: live product search (read only) and Lithic sandbox virtual cards.
      SEARCHAPI_KEY: ${SEARCHAPI_KEY:-}
      LITHIC_API_KEY: ${LITHIC_API_KEY:-}
      LITHIC_ENV: ${LITHIC_ENV:-}
    volumes:
      - bot-state:/app/.synq-local
      - bot-evidence:/app/bounty-evidence
      - /opt/synq/secrets:/run/secrets/synq:ro
    mem_limit: 900m

  web:
    <<: *hardening
    # Built with SYNQ_API_ORIGIN=http://bot:3292 (Next.js fixes rewrites at build time).
    image: ghcr.io/synq-labs-org/synq-web:${SYNQ_IMAGE_TAG:?set SYNQ_IMAGE_TAG}
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/dist/cache:uid=1000,gid=1000
    depends_on:
      - bot
    mem_limit: 256m

volumes:
  caddy-data:
  caddy-config:
  postgres:
  bot-state:
  bot-evidence:
