[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@safe-global/safe-smart-account/=lib/safe-smart-account/",
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
additional_compiler_profiles = [{ name = "safe-legacy", via_ir = false }]
compilation_restrictions = [{ paths = "lib/safe-smart-account/**", via_ir = false }]
