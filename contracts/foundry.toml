[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@safe-global/safe-smart-account/=lib/safe-smart-account/",
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# Safe v1.4.1 is upstream-built with legacy codegen and hits stack-too-deep under via-IR; compile only the
# vendored Safe sources with the legacy pipeline. Synq sources never import them (tests deploy Safe via artifacts).
additional_compiler_profiles = [{ name = "safe-legacy", via_ir = false }]
compilation_restrictions = [{ paths = "lib/safe-smart-account/**", via_ir = false }]
no_match_path = "**/test/fork/**"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "../sources" },
  { access = "read-write", path = "./deployments" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

# Fork suite against Monad testnet Safe v1.4.1 bytecode:
#   FOUNDRY_PROFILE=fork forge test --root contracts --fork-url https://testnet-rpc.monad.xyz
[profile.fork]
match_path = "**/test/fork/**"
no_match_path = "**/__no_exclusions__/**"

[profile.fork.fuzz]
runs = 16

[profile.fork.invariant]
runs = 0

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
ignore = ["lib/**"]
